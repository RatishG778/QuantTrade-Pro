[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanttrade-pro"
version = "5.0.0"
description = "Professional Quantitative Trading Research Platform"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Ratish G" }
]

dependencies = [
    "pandas",
    "numpy",
    "plotly",
    "ta",
    "pytest",
    "fastapi",
    "uvicorn",
    "httpx",
    "yfinance>=1.5,<2"
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "core*",
    "config*",
    "dashboard*",
    "research*",
    "backend*",
    "quant*"
]